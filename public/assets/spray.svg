    <!-- Nozzle Button -->
    <rect x="28" y="8" width="8" height="6" rx="1" fill="#D1D5DB" stroke="#1F2937" stroke-width="1.5" />
    <rect x="30" y="6" width="4" height="2" fill="#9CA3AF" />
    
    <!-- Can Cap/Shoulder -->
    <path d="M 22 20 C 22 14, 42 14, 42 20 Z" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.5" />
    
    <!-- Can Body (Classic Black Hit Style) -->
    <rect x="20" y="20" width="24" height="38" rx="2" fill="#111827" stroke="#1F2937" stroke-width="1.5" />
    
    <!-- Red Accent Band -->
    <rect x="20" y="26" width="24" height="8" fill="#DC2626" />
    
    <!-- Label Text Simulation -->
